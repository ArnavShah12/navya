# Local stack that mirrors AWS: app + PostgreSQL 16 + MinIO (an S3-compatible store, stands in for S3).
# Copy .env.example to .env and fill in DB_PASSWORD and JWT_SECRET first. Compose refuses to start with them empty.
#   docker compose up --build
# App: http://localhost:8080   MinIO console: http://localhost:9001 (login minioadmin / minioadmin, local only)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: navya
      POSTGRES_USER: navya
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U navya -d navya"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      # default local-only login of the emulator, not a secret
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9001:9001"
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "mc alias set l http://minio:9000 minioadmin minioadmin && mc mb -p l/navya"]

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/navya
      DB_USER: navya
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ characters)}
      STORAGE: s3
      S3_BUCKET: navya
      S3_REGION: ap-south-1
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      SEED: ${SEED:-false}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

volumes:
  dbdata:
  s3data:
