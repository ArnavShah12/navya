AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Lets GitHub Actions deploy Navya without any stored AWS key. GitHub proves who it is with a short-lived token (OIDC),
  and only workflows on the main branch of one named repository can assume the role.
Parameters:
  GitHubRepo:
    Type: String
    AllowedPattern: "[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+"
    Description: owner/repository, for example my-team/navya
  Env:
    Type: String
    Default: demo
  CreateProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set to false if this account already has the GitHub OIDC provider (an account can have only one).
Conditions:
  MakeProvider: !Equals [!Ref CreateProvider, "true"]
Resources:
  Provider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "navya-${Env}-github-deploy"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com" }
            Action: "sts:AssumeRoleWithWebIdentity"
            Condition:
              StringEquals: { "token.actions.githubusercontent.com:aud": sts.amazonaws.com }
              StringLike: { "token.actions.githubusercontent.com:sub": !Sub "repo:${GitHubRepo}:ref:refs/heads/main" }
      Policies:
        - PolicyName: push-image-and-update-service
          PolicyDocument:
            Statement:
              - { Effect: Allow, Action: "ecr:GetAuthorizationToken", Resource: "*" }
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/navya-${Env}"
              - { Effect: Allow, Action: [ecs:DescribeTaskDefinition, ecs:RegisterTaskDefinition], Resource: "*" }
              - Effect: Allow
                Action: [ecs:DescribeServices, ecs:UpdateService]
                Resource: !Sub "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/navya-${Env}/navya-${Env}"
              - Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/navya-${Env}-*"
                Condition: { StringEquals: { "iam:PassedToService": ecs-tasks.amazonaws.com } }
Outputs:
  RoleArn:
    Description: Put this in the GitHub repository variable AWS_DEPLOY_ROLE_ARN (it is not a secret)
    Value: !GetAtt DeployRole.Arn
