AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Navya on AWS. CloudFront (HTTPS) to ALB to ECS Fargate to RDS PostgreSQL, S3 for photos and exports,
  SSM Parameter Store for secrets, CloudWatch for logs, metrics and alarms. Region ap-southeast-2 by default (the org allows only us-east-1, us-west-2, ap-southeast-2).
  Deploy with infra/deploy.sh. No secret is in this file: passwords are read from SSM SecureString parameters
  that deploy.sh creates, and the ECS task reads them at start.

Parameters:
  Env:
    Type: String
    Default: demo
    AllowedPattern: "[a-z0-9-]{2,12}"
    Description: Short name used in resource names and the SSM parameter path (/navya/<Env>/...).
  ImageTag:
    Type: String
    Default: latest
    Description: Tag of the image in the ECR repository. CI uses the git commit SHA.
  DesiredCount:
    Type: Number
    Default: 0
    Description: Tasks to run. 0 for the first deploy (the repository is empty), then 1 or 2. Set to 0 between demos to stop paying for compute.
  MaxCount:
    Type: Number
    Default: 4
    Description: Upper limit for auto scaling. This is the cost cap on compute.
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
  DbEngineVersion:
    Type: String
    Default: "17"
    Description: PostgreSQL version. deploy.sh passes the default version AWS offers in the region on the day, because older versions stop being allowed for new instances.
  DbBackupDays:
    Type: Number
    Default: 1
    Description: Days of automated RDS backups. Check what your account type allows before raising it.
  DbSnapshotId:
    Type: String
    Default: ""
    Description: Restore the database from this snapshot (the one infra/teardown.sh prints) instead of creating an empty one.
  DbMultiAz:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  CloudFrontPrefixListId:
    Type: String
    Description: Id of the AWS-managed prefix list com.amazonaws.global.cloudfront.origin-facing in this region (deploy.sh looks it up).
  OriginSecret:
    Type: String
    NoEcho: true
    MinLength: 24
    Description: Random value CloudFront sends to the ALB in the X-Origin-Verify header. The ALB refuses requests without it. deploy.sh generates it.
  AlertEmail:
    Type: String
    Description: Address for alarm emails (SNS asks this address to confirm).
  AdminEmail:
    Type: String
    Default: ""
    Description: Moderator account to create on start (leave empty for none). Its password is the SSM parameter /navya/<Env>/admin-password.

Conditions:
  FromSnapshot: !Not [!Equals [!Ref DbSnapshotId, ""]]

Resources:
  # ---------------------------------------------------------------- network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub "navya-${Env}" }]

  Igw:
    Type: AWS::EC2::InternetGateway
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref Igw }

  PublicA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "navya-${Env}-public-a" }]
  PublicB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "navya-${Env}-public-b" }]
  PrivateA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: !Sub "navya-${Env}-private-a" }]
  PrivateB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{ Key: Name, Value: !Sub "navya-${Env}-private-b" }]

  PublicRt:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties: { RouteTableId: !Ref PublicRt, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref Igw }
  PublicRtA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicA, RouteTableId: !Ref PublicRt }
  PublicRtB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicB, RouteTableId: !Ref PublicRt }
  # Private subnets have no route to the internet. Only the database lives there.
  PrivateRt:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PrivateRtA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateA, RouteTableId: !Ref PrivateRt }
  PrivateRtB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateB, RouteTableId: !Ref PrivateRt }

  # Free gateway endpoint: photo traffic to S3 stays on the AWS network.
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PublicRt, !Ref PrivateRt]

  AlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Load balancer. Accepts HTTP from CloudFront only.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, SourcePrefixListId: !Ref CloudFrontPrefixListId }
  AppSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App tasks. Accept 8080 from the load balancer only.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref AlbSg }
  DbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Database. Accepts 5432 from the app tasks only.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref AppSg }

  # ---------------------------------------------------------------- storage and database
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "navya-${Env}-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration: { BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - { Id: expire-exports, Status: Enabled, Prefix: exports/, ExpirationInDays: 30 }
          - { Id: abort-partial-uploads, Status: Enabled, AbortIncompleteMultipartUpload: { DaysAfterInitiation: 2 } }
  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Statement:
          - Sid: TlsOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt DataBucket.Arn, !Sub "${DataBucket.Arn}/*"]
            Condition: { Bool: { "aws:SecureTransport": "false" } }

  DbSubnets:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for Navya
      SubnetIds: [!Ref PrivateA, !Ref PrivateB]
  Db:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub "navya-${Env}"
      Engine: postgres
      EngineVersion: !Ref DbEngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      DBSnapshotIdentifier: !If [FromSnapshot, !Ref DbSnapshotId, !Ref "AWS::NoValue"]
      DBName: !If [FromSnapshot, !Ref "AWS::NoValue", navya]
      MasterUsername: !If [FromSnapshot, !Ref "AWS::NoValue", navya]
      MasterUserPassword: !Sub "{{resolve:ssm-secure:/navya/${Env}/db-password}}"
      DBSubnetGroupName: !Ref DbSubnets
      VPCSecurityGroups: [!Ref DbSg]
      PubliclyAccessible: false
      MultiAZ: !Ref DbMultiAz
      BackupRetentionPeriod: !Ref DbBackupDays
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true

  # ---------------------------------------------------------------- container platform
  Repo:
    Type: AWS::ECR::Repository
    DeletionPolicy: Delete
    Properties:
      RepositoryName: !Sub "navya-${Env}"
      EmptyOnDelete: true
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep the last 10 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "navya-${Env}"
      ClusterSettings: [{ Name: containerInsights, Value: enabled }]

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/navya/${Env}/app"
      RetentionInDays: 14

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: "sts:AssumeRole" }]
      ManagedPolicyArns: ["arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"]
      Policies:
        - PolicyName: read-own-secrets
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: ssm:GetParameters
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/navya/${Env}/*"
              - Effect: Allow
                Action: kms:Decrypt
                Resource: "*"
                Condition: { StringEquals: { "kms:ViaService": !Sub "ssm.${AWS::Region}.amazonaws.com" } }

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: "sts:AssumeRole" }]
      Policies:
        - PolicyName: own-bucket-only
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${DataBucket.Arn}/*"
              # without ListBucket a missing key answers 403 instead of 404
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn

  TaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "navya-${Env}"
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: app
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${Repo}:${ImageTag}"
          Essential: true
          PortMappings: [{ ContainerPort: 8080 }]
          StopTimeout: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
          Environment:
            - { Name: PORT, Value: "8080" }
            - { Name: DATA_DIR, Value: /data }
            - { Name: DB_URL, Value: !Sub "jdbc:postgresql://${Db.Endpoint.Address}:5432/navya?sslmode=require" }
            - { Name: DB_USER, Value: navya }
            - { Name: STORAGE, Value: s3 }
            - { Name: S3_BUCKET, Value: !Ref DataBucket }
            - { Name: S3_REGION, Value: !Ref AWS::Region }
            - { Name: ADMIN_EMAIL, Value: !Ref AdminEmail }
          Secrets:
            - { Name: DB_PASSWORD, ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/navya/${Env}/db-password" }
            - { Name: JWT_SECRET, ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/navya/${Env}/jwt-secret" }
            - { Name: ADMIN_PASSWORD, ValueFrom: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/navya/${Env}/admin-password" }

  Alb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "navya-${Env}"
      Scheme: internet-facing
      Type: application
      Subnets: [!Ref PublicA, !Ref PublicB]
      SecurityGroups: [!Ref AlbSg]
      LoadBalancerAttributes:
        # chat sockets stay open, so allow idle connections for a while
        - { Key: idle_timeout.timeout_seconds, Value: "300" }
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "navya-${Env}"
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 8080
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: "30" }
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Alb
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: { StatusCode: "403", ContentType: text/plain, MessageBody: Forbidden }
  ListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref Listener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig: { HttpHeaderName: X-Origin-Verify, Values: [!Ref OriginSecret] }
      Actions: [{ Type: forward, TargetGroupArn: !Ref TargetGroup }]

  Service:
    Type: AWS::ECS::Service
    DependsOn: ListenerRule
    Properties:
      ServiceName: !Sub "navya-${Env}"
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref TaskDef
      HealthCheckGracePeriodSeconds: 90
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          # public IP so the task can pull the image and reach AWS APIs without a NAT gateway (which bills per hour)
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicA, !Ref PublicB]
          SecurityGroups: [!Ref AppSg]
      LoadBalancers:
        - { ContainerName: app, ContainerPort: 8080, TargetGroupArn: !Ref TargetGroup }

  # ---------------------------------------------------------------- scaling
  ScalingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement: [{ Effect: Allow, Principal: { Service: application-autoscaling.amazonaws.com }, Action: "sts:AssumeRole" }]
      Policies:
        - PolicyName: scale-this-service
          PolicyDocument:
            Statement:
              - { Effect: Allow, Action: ["ecs:DescribeServices", "ecs:UpdateService"], Resource: !Ref Service }
              - { Effect: Allow, Action: ["cloudwatch:DescribeAlarms", "cloudwatch:PutMetricAlarm", "cloudwatch:DeleteAlarms"], Resource: "*" }
  ScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub "service/${Cluster}/${Service.Name}"
      MinCapacity: 0
      MaxCapacity: !Ref MaxCount
      RoleARN: !GetAtt ScalingRole.Arn
  CpuScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: cpu-60
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        PredefinedMetricSpecification: { PredefinedMetricType: ECSServiceAverageCPUUtilization }
        ScaleOutCooldown: 60
        ScaleInCooldown: 300
  RequestScaling:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: requests-per-task
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 300 # placeholder until the load test on the real task size gives a measured value
        PredefinedMetricSpecification:
          PredefinedMetricType: ALBRequestCountPerTarget
          ResourceLabel: !Sub "${Alb.LoadBalancerFullName}/${TargetGroup.TargetGroupFullName}"
        ScaleOutCooldown: 60
        ScaleInCooldown: 300

  # ---------------------------------------------------------------- CloudFront: HTTPS entry point
  OriginRequest:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "navya-${Env}-forward-all"
        HeadersConfig: { HeaderBehavior: allViewer }
        CookiesConfig: { CookieBehavior: all }
        QueryStringsConfig: { QueryStringBehavior: all }
  # HSTS on every response, including the static page that the app's own filter does not reach
  ResponseHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "navya-${Env}-hsts"
        SecurityHeadersConfig:
          StrictTransportSecurity: { AccessControlMaxAgeSec: 31536000, IncludeSubdomains: false, Override: true }
  Cdn:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "navya-${Env}"
        HttpVersion: http2
        PriceClass: PriceClass_200
        Origins:
          - Id: alb
            DomainName: !GetAtt Alb.DNSName
            CustomOriginConfig: { OriginProtocolPolicy: http-only, HTTPPort: 80, OriginReadTimeout: 60 }
            OriginCustomHeaders: [{ HeaderName: X-Origin-Verify, HeaderValue: !Ref OriginSecret }]
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # managed CachingDisabled
          OriginRequestPolicyId: !Ref OriginRequest
          ResponseHeadersPolicyId: !Ref ResponseHeaders
          Compress: true
        CacheBehaviors:
          - PathPattern: /img/*
            TargetOriginId: alb
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # managed CachingOptimized, honours the app's one-year Cache-Control
            ResponseHeadersPolicyId: !Ref ResponseHeaders
            Compress: false

  # ---------------------------------------------------------------- monitoring
  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      Subscription: [{ Protocol: email, Endpoint: !Ref AlertEmail }]

  ErrorsFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: "ERROR"
      MetricTransformations: [{ MetricNamespace: !Sub "Navya/${Env}", MetricName: AppErrors, MetricValue: "1", DefaultValue: 0 }]
  BoostsFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '"action=boost.paid"'
      MetricTransformations: [{ MetricNamespace: !Sub "Navya/${Env}", MetricName: BoostsPaid, MetricValue: "1", DefaultValue: 0 }]
  SlowPaymentFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '"payment slow"'
      MetricTransformations: [{ MetricNamespace: !Sub "Navya/${Env}", MetricName: SlowPayments, MetricValue: "1", DefaultValue: 0 }]
  RequestsFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogGroup
      FilterPattern: '"request method="'
      MetricTransformations: [{ MetricNamespace: !Sub "Navya/${Env}", MetricName: AppRequests, MetricValue: "1", DefaultValue: 0 }]

  Alarm5xx:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The app answered with server errors
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions: [{ Name: LoadBalancer, Value: !GetAtt Alb.LoadBalancerFullName }]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]
  AlarmNoHealthyTask:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: No healthy app task behind the load balancer
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - { Name: LoadBalancer, Value: !GetAtt Alb.LoadBalancerFullName }
        - { Name: TargetGroup, Value: !GetAtt TargetGroup.TargetGroupFullName }
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlertTopic]
  AlarmDbStorage:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Database has less than 2 GB free
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions: [{ Name: DBInstanceIdentifier, Value: !Ref Db }]
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2147483648
      ComparisonOperator: LessThanThreshold
      AlarmActions: [!Ref AlertTopic]
  AlarmAppErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The app logged 5 or more errors in 5 minutes
      Namespace: !Sub "Navya/${Env}"
      MetricName: AppErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertTopic]

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "navya-${Env}"
      DashboardBody: !Sub
        - |
          {"widgets":[
            {"type":"metric","x":0,"y":0,"width":8,"height":6,"properties":{"title":"Requests and 5xx (ALB)","region":"${AWS::Region}","stat":"Sum","period":60,"metrics":[["AWS/ApplicationELB","RequestCount","LoadBalancer","${Lb}"],[".","HTTPCode_Target_5XX_Count",".","."]]}},
            {"type":"metric","x":8,"y":0,"width":8,"height":6,"properties":{"title":"Response time p95 (s)","region":"${AWS::Region}","stat":"p95","period":60,"metrics":[["AWS/ApplicationELB","TargetResponseTime","LoadBalancer","${Lb}"]]}},
            {"type":"metric","x":16,"y":0,"width":8,"height":6,"properties":{"title":"App CPU and memory (%)","region":"${AWS::Region}","stat":"Average","period":60,"metrics":[["AWS/ECS","CPUUtilization","ClusterName","navya-${Env}","ServiceName","navya-${Env}"],[".","MemoryUtilization",".",".",".","."]]}},
            {"type":"metric","x":0,"y":6,"width":8,"height":6,"properties":{"title":"Database connections","region":"${AWS::Region}","stat":"Average","period":60,"metrics":[["AWS/RDS","DatabaseConnections","DBInstanceIdentifier","navya-${Env}"]]}},
            {"type":"metric","x":8,"y":6,"width":8,"height":6,"properties":{"title":"Database CPU (%)","region":"${AWS::Region}","stat":"Average","period":60,"metrics":[["AWS/RDS","CPUUtilization","DBInstanceIdentifier","navya-${Env}"]]}},
            {"type":"metric","x":16,"y":6,"width":8,"height":6,"properties":{"title":"App events from the log","region":"${AWS::Region}","stat":"Sum","period":60,"metrics":[["Navya/${Env}","AppRequests"],[".","BoostsPaid"],[".","AppErrors"],[".","SlowPayments"]]}}
          ]}
        - Lb: !GetAtt Alb.LoadBalancerFullName

Outputs:
  Url:
    Description: Public HTTPS address
    Value: !Sub "https://${Cdn.DomainName}"
  AlbDnsName:
    Value: !GetAtt Alb.DNSName
  RepositoryUri:
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${Repo}"
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  BucketName:
    Value: !Ref DataBucket
  DbEndpoint:
    Value: !GetAtt Db.Endpoint.Address
  LogGroupName:
    Value: !Ref LogGroup
  DashboardUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=navya-${Env}"
